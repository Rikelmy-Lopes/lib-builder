[package]
name = "Lib_Builder"
version = "0.0.1"
edition = "2024"

[dependencies]
dirs = "6.0.0"
iced = "0.14"
include_dir = "0.7.4"
rfd = { version = "0.17.2" }
tokio = { version = "1.52.3", features=["process"] }
walkdir = "2.5.0"

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[profile.dev]
opt-level = 0
